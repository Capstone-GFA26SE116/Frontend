 y="201.2529">not completed.</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="138.7168" x="173.9336" y="153.8594"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="118.7168" x="183.9336" y="176.3164">Filter the eligible tasks</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="224.123" x="131.2305" y="278.0273"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="204.123" x="141.2305" y="300.4844">Notify that there is nothing to schedule</text><ellipse cx="243.292" cy="352.0742" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="243.292" cy="352.0742" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#F1F1F1" points="200.4897,229.1094,286.0942,229.1094,298.0942,241.1094,286.0942,253.1094,200.4897,253.1094,188.4897,241.1094,200.4897,229.1094" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="14.0615" x="247.292" y="264.5283">No</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="85.6045" x="200.4897" y="245.6104">Any eligible task?</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="247.4727" x="119.5557" y="405.0742"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="227.4727" x="129.5557" y="427.5313">Request a schedule proposal for each task</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="311.498" x="87.543" y="460.168"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="291.498" x="97.543" y="482.625">Receive the proposed slots and warnings